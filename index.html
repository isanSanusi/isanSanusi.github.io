<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <meta
      name="description"
      content="Portfolio of Sandi Hadiansyah — web development, visual design, and data automation."
    />
    <title>Shadyans — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#/" aria-label="Shadyans home"
          ><span class="brand-mark">s.</span
          ><span data-profile="logo">shadyans.dev</span></a
        >
        <button
          class="mobile-menu-button icon-button"
          id="menu-toggle"
          aria-label="Open navigation"
          aria-expanded="false"
        >
          <span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
          <a href="#/" data-route-link="/">Home</a
          ><a href="#/portfolio" data-route-link="/portfolio">Portfolio</a
          ><a href="#/journal" data-route-link="/journal">Journal</a
          ><a href="#/about" data-route-link="/about">About</a>
          <a class="nav-contact" href="#/contact" data-route-link="/contact"
            >Let's talk <span aria-hidden="true">↗</span></a
          >
          <button
            id="theme-toggle"
            class="icon-button theme-toggle"
            aria-label="Switch color theme"
            title="Switch color theme"
          >
            <span class="theme-icon">☼</span>
          </button>
        </nav>
      </header>
      <main id="app" tabindex="-1" aria-live="polite"></main>
      <footer class="site-footer">
        <a class="brand footer-brand" href="#/"
          ><span class="brand-mark">s.</span
          ><span data-profile="logo">shadyans.dev</span></a
        >
        <p>Independent builder. Practical systems, thoughtful interfaces.</p>
        <div class="footer-links">
          <a
            data-profile-link="github"
            href="https://github.com/isanSanusi"
            target="_blank"
            rel="noreferrer"
            >GitHub ↗</a
          ><a
            data-profile-link="behance"
            href="https://behance.net"
            target="_blank"
            rel="noreferrer"
            >Behance ↗</a
          ><a
            data-profile-link="linkedin"
            href="https://linkedin.com"
            target="_blank"
            rel="noreferrer"
            >LinkedIn ↗</a
          >
        </div>
        <span class="copyright">© <span id="year"></span> Shadyans</span>
      </footer>
    </div>
    <dialog
      id="project-dialog"
      class="project-dialog"
      aria-labelledby="dialog-title"
    >
      <button
        class="dialog-close icon-button"
        data-close-dialog
        aria-label="Close project details"
      >
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <dialog
      id="article-dialog"
      class="project-dialog article-dialog"
      aria-labelledby="article-dialog-title"
    >
      <button
        class="dialog-close icon-button"
        data-close-dialog
        aria-label="Close article"
      >
        ×
      </button>
      <div id="article-dialog-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
